services:
  mongo-test:
    image: mongo:8.0
    command: ["mongod", "--port", "27018", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27018"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --port 27018 --eval \"try { rs.status().ok } catch (error) { rs.initiate({_id:'rs0',members:[{_id:0,host:'127.0.0.1:27018'}]}).ok }\" | grep 1",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
