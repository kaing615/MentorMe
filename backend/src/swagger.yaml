                userName:
                  type: string
                  example: "mentor_updated"
                firstName:
                  type: string
                  example: "Tran"
                lastName:
                  type: string
                  example: "Van B Updated"
                jobTitle:
                  type: string
                  example: "Tech Lead"
                category:
                  type: string
                  example: "Technology"
                bio:
                  type: string
                  example: "Updated bio with more experience"
                mentorReason:
                  type: string
                  example: "Passionate about mentoring"
                location:
                  type: string
                  example: "Ho Chi Minh City"
                skills:
                  type: array
                  items:
                    type: string
                  example: ["JavaScript", "Node.js", "React"]
                greatestAchievement:
                  type: string
                  example: "Led a team of 10 developers"
                headline:
                  type: string
                  example: "Experienced Tech Lead"
                experience:
                  type: string
                  example: "7+ years in software development"
                introVideo:
                  type: string
                  example: "https://youtube.com/watch?v=abc123"
                languages:
                  type: array
                  items:
                    type: string
