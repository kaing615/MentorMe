  # ===========================================
  # AVAILABILITY MANAGEMENT ENDPOINTS
  # ===========================================
  /availability:
    post:
      tags:
        - Availability Management
      summary: Tạo hoặc cập nhật availability
      description: |
        Mentor tạo hoặc cập nhật availability cho một ngày cụ thể.
        - Chỉ mentor mới có thể tạo availability
        - Không thể tạo cho ngày trong quá khứ  
        - Nếu đã có booking, không thể cập nhật
        - Slots phải có thời gian tối thiểu 30 phút và không chồng lấn
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - slots
              properties:
                date:
                  type: string
                  format: date
                  description: Ngày tạo availability (YYYY-MM-DD)
                  example: "2025-08-31"
                timezone:
                  type: string
                  default: "Asia/Ho_Chi_Minh"
                  description: Timezone cho availability
                  example: "Asia/Ho_Chi_Minh"
                slots:
                  type: array
                  description: Danh sách thời gian rảnh
                  minItems: 1
                  items:
                    type: object
                    required:
                      - start
                      - end
                    properties:
                      start:
                        type: string
                        pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"
                        description: Thời gian bắt đầu (HH:mm format 24h)
                        example: "09:00"
                      end:
                        type: string
                        pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"
                        description: Thời gian kết thúc (HH:mm format 24h)
                        example: "09:30"
      responses:
        "201":
          description: Availability được tạo/cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Availability đã được tạo/cập nhật thành công"
                      availability:
                        $ref: "#/components/schemas/Availability"
        "400":
          description: Lỗi validation hoặc business logic
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Chỉ mentor mới có thể tạo availability
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /availability:
    get:
      tags:
        - Availability Management
      summary: Lấy availability của mentor theo ngày
      description: |
        Lấy availability của mentor cho một ngày cụ thể.
        - Mentor chỉ có thể xem availability của chính mình (bảo mật)
        - Nếu không truyền date sẽ lấy ngày hiện tại
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          description: Ngày cần lấy availability (YYYY-MM-DD). Nếu không truyền sẽ sử dụng ngày hiện tại.
          example: "2025-08-31"
      responses:
        "200":
          description: Lấy availability thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      availability:
                        $ref: "#/components/schemas/Availability"

  /availability/today-schedule:
    get:
      tags:
        - Availability Management
      summary: Lấy lịch chi tiết trong ngày của mentor
      description: |
        Lấy lịch chi tiết trong ngày của mentor với thống kê đầy đủ:
        - Thông tin mentor (name, avatar, jobTitle)
        - Thống kê slots (total, open, blocked)
        - Duration calculation cho từng slot
        - Timezone support
        - Mentor chỉ có thể xem lịch của chính mình
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          description: Ngày cần lấy lịch (YYYY-MM-DD). Nếu không truyền sẽ sử dụng ngày hiện tại.
          example: "2025-09-01"
      responses:
        "200":
          description: Lấy lịch trong ngày thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Lịch trong ngày được tải thành công"
                      schedule:
                        type: object
                        properties:
                          date:
                            type: string
                            format: date
                            example: "2025-09-01"
                          mentor:
                            type: object
                            properties:
                              _id:
                                type: string
                                example: "68b55a20bf598e0c18cf9034"
                              firstName:
                                type: string
                                example: "John"
                              lastName:
                                type: string
                                example: "Smith"
                              avatarUrl:
                                type: string
                                example: ""
                              jobTitle:
                                type: string
                                example: "Senior Software Engineer"
                          timezone:
                            type: string
                            example: "Asia/Ho_Chi_Minh"
                          totalSlots:
                            type: integer
                            example: 5
                          openSlots:
                            type: integer
                            example: 3
                          blockedSlots:
                            type: integer
                            example: 2
                          slots:
                            type: array
                            items:
                              type: object
                              properties:
                                _id:
                                  type: string
                                  example: "slot_id_123"
                                start:
                                  type: string
                                  example: "09:00"
                                end:
                                  type: string
                                  example: "10:00"
                                status:
                                  type: string
                                  enum: [open, blocked]
                                  example: "open"
                                duration:
                                  type: string
                                  example: "1h"
                                isAvailable:
                                  type: boolean
                                  example: true
        "403":
          description: Chỉ mentor mới có thể xem lịch của mình
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /availability/mentor/range:
    get:
      tags:
        - Availability Management
      summary: Lấy availability của mentor trong khoảng thời gian
      description: Lấy tất cả availability của mentor trong khoảng thời gian (chỉ mentor của chính mình). Nếu không truyền startDate và endDate, sẽ lấy từ hôm nay đến 7 ngày tiếp theo.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: startDate
          required: false
          schema:
            type: string
            format: date
          description: Ngày bắt đầu (YYYY-MM-DD). Mặc định là ngày hiện tại.
          example: "2025-08-30"
        - in: query
          name: endDate
          required: false
          schema:
            type: string
            format: date
          description: Ngày kết thúc (YYYY-MM-DD). Mặc định là 7 ngày kể từ ngày hiện tại.
          example: "2025-09-05"
      responses:
        "200":
          description: Lấy danh sách availability thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      availabilities:
                        type: array
                        items:
                          $ref: "#/components/schemas/Availability"
                      count:
                        type: integer
                        example: 5

  /availability/{availabilityId}:
    delete:
      tags:
        - Availability Management
      summary: Xóa availability
      description: |
        Xóa availability (chỉ khi không có slot nào đang được held hoặc booked)
        - Chỉ mentor sở hữu mới có thể xóa
        - Không thể xóa nếu có booking active
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: availabilityId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: ID của availability cần xóa
      responses:
        "200":
          description: Xóa availability thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Availability đã được xóa thành công"

