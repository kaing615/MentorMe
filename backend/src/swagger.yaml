  /availability/cleanup-old:
    post:
      tags:
        - Availability Management
      summary: Manual cleanup availability cũ (Admin only)
      description: |
        Manual trigger cleanup cho availability records cũ.
        - Chỉ admin mới có thể sử dụng endpoint này
        - Mặc định cleanup records cũ hơn 3 ngày
        - Có thể custom số ngày thông qua daysBack parameter
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daysBack:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 3
                  description: Số ngày để cleanup (records cũ hơn X ngày sẽ bị xóa)
                  example: 7
            examples:
              default:
                summary: Cleanup mặc định (3 ngày)
                value: {}
              custom:
                summary: Custom cleanup (7 ngày)
                value:
                  daysBack: 7
      responses:
        "200":
          description: Cleanup thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Cleanup completed successfully"
                      deletedCount:
                        type: integer
                        example: 25
                      cutoffDate:
                        type: string
                        format: date-time
                        example: "2024-01-15T00:00:00.000Z"
                      daysBack:
                        type: integer
                        example: 3
                      timestamp:
                        type: string
                        format: date-time
                        example: "2024-01-18T10:30:00.000Z"
        "403":
          description: Chỉ admin mới có thể cleanup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: daysBack parameter không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
