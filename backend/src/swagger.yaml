        - Shopping Cart
      summary: Kiểm tra khóa học có trong giỏ hàng không
      description: Kiểm tra xem một khóa học cụ thể có trong giỏ hàng của user không. Giỏ hàng sẽ được tự động tạo nếu chưa tồn tại.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: courseId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: ID của khóa học cần kiểm tra (MongoDB ObjectId)
          example: "60d5f484f0b4a720e8f8d4a1"
      responses:
        "200":
          description: Kiểm tra thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckCartResponse"
        "400":
          description: Course ID không hợp lệ (validation middleware)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 400
                message: "Course ID không hợp lệ"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Không tìm thấy khóa học
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                status: 404
                message: "Không tìm thấy khóa học."
        "500":
          description: Lỗi server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  # =========================
  # BOOKING ENDPOINTS
  # =========================

  /booking/mentor/{mentorId}:
    post:
      tags: [Booking]
      summary: Tạo booking cho một mentor (mentee khởi tạo)
      description: |
        Tạo lịch hẹn mới dựa trên Availability của mentor.
        Không cho phép đặt trùng khung giờ đã booked/active.
        Yêu cầu đăng nhập (JWT). Trạng thái tạo ra sẽ là `pending`.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: mentorId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: MongoDB ObjectId của mentor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreateRequest"
            examples:
              default:
                value:
                  date: "2025-09-01"
                  start: "09:00"
                  end: "10:00"
                  notes: "Muốn trao đổi về phỏng vấn FE"
      responses:
        "200":
          description: Tạo booking thành công (status = pending)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Booking created successfully"
                  booking:
                    $ref: "#/components/schemas/Booking"
        "400":
          description: Lỗi validation / Slot không khả dụng / Trùng lịch
        "401":
          description: Unauthorized
        "404":
          description: Mentor/Mentee không tồn tại

  /booking:
    get:
      tags: [Booking]
      summary: (Admin) Lấy danh sách bookings
      description: |
        Chỉ **admin** được phép.
        Hỗ trợ lọc theo mentor, mentee, ngày, khoảng ngày, trạng thái; phân trang theo cursor `_id`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: mentor
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
          description: Lọc theo mentorId
        - in: query
          name: mentee
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
          description: Lọc theo menteeId
        - in: query
          name: date
          schema: { type: string, format: date }
          description: Lọc theo 1 ngày
        - in: query
          name: from
          schema: { type: string, format: date }
          description: Từ ngày
        - in: query
          name: to
          schema: { type: string, format: date }
          description: Đến ngày
        - in: query
          name: status
          schema: { type: string }
          description: "Danh sách status, phân tách bằng dấu phẩy. Ví dụ: pending,active"
          example: "pending,active"
        - in: query
          name: before
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
          description: Cursor `_id` nhỏ hơn để phân trang lùi
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
          description: Số lượng tối đa mỗi trang
      responses:
        "200":
          description: Danh sách bookings cho admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingListAdminResponse"
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (không phải admin)

  /booking/confirm/{id}:
    post:
      tags: [Booking]
      summary: Mentor/Admin xác nhận booking (từ pending → active)
      description: |
        Chỉ **mentor của booking** hoặc **admin** mới được xác nhận.
        Hệ thống sẽ gửi thông báo cho mentee (lịch đã được xác nhận) và cho mentor (bạn đã xác nhận),
        đồng thời tạo reminder trước giờ hẹn nếu còn thời gian.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: BookingId
      responses:
        "200":
          description: Xác nhận thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingActionResponse"
        "400":
          description: Không thể xác nhận (không ở trạng thái pending / lỗi khác)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (không phải mentor/admin của booking)
        "404":
          description: Không tìm thấy booking

  /booking/cancel/{id}:
    post:
      tags: [Booking]
      summary: Huỷ booking (mentor/mentee/admin)
      description: |
        Cho phép **mentor**, **mentee** của booking hoặc **admin** huỷ booking ở trạng thái `pending`/`active`.
        Khi huỷ sẽ **mở lại slot** tương ứng trong Availability.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: BookingId
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelBookingRequest"
            examples:
              with_reason:
                value:
                  reason: "Bận đột xuất"
      responses:
        "200":
          description: Huỷ thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingActionResponse"
        "400":
          description: Không thể huỷ (đã bắt đầu phiên / trạng thái không hợp lệ / lỗi khác)
        "401":
          description: Unauthorized
        "403":
          description: Forbidden (không phải mentor/mentee/admin của booking)
        "404":
          description: Không tìm thấy booking

  /booking/{id}:
    patch:
      tags: [Booking]
      summary: Cập nhật booking theo id
      description: |
        Cập nhật thông tin booking (khuyến nghị chỉ cho admin hoặc chủ sở hữu).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingUpdateRequest"
      responses:
        "200":
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: Lỗi validation
        "401":
          description: Unauthorized
        "404":
          description: Không tìm thấy booking

    delete:
      tags: [Booking]
      summary: Xoá booking theo id
      description: |
        Xoá booking (khuyến nghị chỉ admin).
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      responses:
        "200":
          description: Xoá thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Booking deleted"
        "401":
          description: Unauthorized
        "404":
          description: Không tìm thấy booking
  /messages:
    post:
      tags: [Messages]
      summary: Gửi tin nhắn
      description: Gửi tin nhắn giữa 2 người dùng. Yêu cầu JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageSendRequest"
      responses:
        "201":
          description: Tạo tin nhắn thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "200":
          description: (Fallback) Server có thể trả 200 nếu không dùng created()
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Lỗi validation (receiver không hợp lệ, tự nhắn cho mình, thiếu content/attachments, messageType sai…)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    get:
      tags: [Messages]
      summary: Lấy tin nhắn theo hội thoại (me ↔ peer)
      description: Trả về danh sách tin nhắn và `nextCursor` để phân trang lùi. Yêu cầu JWT.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: peer
          required: true
          schema:
            type: string
            description: ObjectId của đối tác hội thoại
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
          description: Số bản ghi tối đa
        - in: query
          name: cursor
          schema:
            type: string
          description: Con trỏ phân trang dạng "<ISO>_<ObjectId>"
          example: "2025-08-31T07:15:00.000Z_66d21a3e9d3b5d9fef123456"
      responses:
        "200":
          description: Lấy danh sách tin nhắn thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageListResponse"
        "400":
          description: Peer không hợp lệ / cursor sai định dạng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages/mark-delivered:
    post:
      tags: [Messages]
      summary: Đánh dấu "delivered" cho các tin nhắn bạn vừa nhận
      description: Chỉ áp dụng cho tin nhắn có `receiver = me` và `status = sent`. Yêu cầu JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageMarkDeliveredRequest"
      responses:
        "200":
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageUpdateCountResponse"
        "400":
          description: Không có ID hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages/mark-read:
    post:
      tags: [Messages]
      summary: Đánh dấu "đã đọc" tất cả tin nhắn từ một peer → me
      description: Cập nhật các tin có `sender = peerId` và `receiver = me` với `read = true, readAt = now`. Yêu cầu JWT.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageMarkReadRequest"
      responses:
        "200":
          description: Cập nhật trạng thái đọc thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageUpdateCountResponse"
        "400":
          description: peerId không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /messages/conversations:
    get:
      tags: [Messages]
      summary: Lấy danh sách hội thoại (gộp theo peer, kèm tin nhắn cuối)
      description: Kết quả gồm `peerId`, `unreadCount`, và `lastMessage`. Yêu cầu JWT.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lấy danh sách hội thoại thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"