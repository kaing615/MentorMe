  # =========================
  # BOOKING ENDPOINTS
  # =========================
  /booking/mentor/{mentorId}:
    post:
      tags: [Booking]
      summary: Tạo booking cho một mentor (mentee khởi tạo)
      description: |
        Tạo lịch hẹn mới dựa trên Availability của mentor.
        Không cho phép đặt trùng khung giờ đã booked/active.
        Yêu cầu đăng nhập (JWT). Trạng thái tạo ra sẽ là `pending`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: mentorId
          required: true
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingCreateRequest" }
            examples:
              default:
                value:
                  date: "2025-09-01"
                  start: "09:00"
                  end: "10:00"
                  notes: "Muốn trao đổi về phỏng vấn FE"
      responses:
        "200":
          description: Tạo booking thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    { type: string, example: "Booking created successfully" }
                  booking: { $ref: "#/components/schemas/Booking" }

  /booking:
    get:
      tags: [Booking]
      summary: (Admin) Lấy danh sách bookings
      description: |
        Chỉ **admin** được phép.
        Hỗ trợ lọc theo mentor, mentee, ngày, khoảng ngày, trạng thái; phân trang theo cursor `_id`.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: mentor
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - in: query
          name: mentee
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
        - in: query
          name: date
          schema: { type: string, format: date }
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: status
          schema: { type: string }
          description: "Danh sách status, phân tách bằng dấu phẩy (VD: pending,active)"
        - in: query
          name: before
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
          description: Cursor `_id` nhỏ hơn để phân trang lùi
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingListAdminResponse" }

  /booking/confirm/{id}:
    post:
      tags: [Booking]
      summary: Mentor/Admin xác nhận booking (pending → active)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingActionResponse" }

  /booking/cancel/{id}:
    post:
      tags: [Booking]
      summary: Huỷ booking (mentor/mentee/admin)
      description: Huỷ booking ở trạng thái `pending`/`active`. Khi huỷ sẽ **mở lại slot** trong Availability.
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelBookingRequest" }
            examples:
              with_reason:
                value:
                  reason: "Bận đột xuất"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BookingActionResponse" }

  /booking/{id}:
    patch:
      tags: [Booking]
      summary: Cập nhật booking theo id
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BookingUpdateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }

    delete:
      tags: [Booking]
      summary: Xoá booking theo id (admin)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Booking deleted" }

  # =========================
  # AVAILABILITY ENDPOINTS
  # =========================
  /availability:
    post:
      tags: [Availability Management]
      summary: Tạo hoặc cập nhật availability
      description: |
        Mentor tạo/cập nhật availability cho một ngày.
        - Chỉ mentor mới có thể tạo
        - Không thể tạo cho ngày quá khứ
        - Slots 30 phút, không chồng lấn
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, slots]
              properties:
                date:
                  type: string
                  format: date
                  example: "2025-08-31"
                timezone:
                  type: string
                  default: "Asia/Ho_Chi_Minh"
                slots:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [start, end]
                    properties:
                      start:
                        type: string
                        pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"
                        example: "09:00"
                      end:
                        type: string
                        pattern: "^([0-1]?[0-9]|2[0-3]):[0-5][0-9]$"
                        example: "09:30"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "Availability đã được tạo/cập nhật thành công",
                    }
                  availability: { $ref: "#/components/schemas/Availability" }
  /availability/public-schedule:
    get:
      tags:
        - Availability Management
      summary: Lấy lịch trống của mentor (dành cho mentee/public)
      description: |
        Lấy lịch chi tiết trong ngày của mentor với thống kê đầy đủ:
        - Thông tin mentor (name, avatar, jobTitle)
        - Thống kê slots (total, open, blocked)
        - Duration calculation cho từng slot
        - Timezone support
        - API công khai, không cần đăng nhập
        - Bất kỳ ai (mentee, guest) cũng có thể xem lịch trống của mentor
      parameters:
        - in: query
          name: mentorId
          required: true
          schema:
            type: string
          description: ID của mentor cần xem lịch
          example: "60a4f4b2e5b8c5001f7a1234"
        - in: query
          name: date
          required: false
          schema:
            type: string
            format: date
          description: Ngày cần lấy lịch (YYYY-MM-DD). Nếu không truyền sẽ sử dụng ngày hiện tại.
          example: "2025-09-01"
      responses:
        "200":
          description: Lấy lịch mentor thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Lịch mentor được tải thành công"
                      schedule:
                        type: object
                        properties:
                          date:
                            type: string
                            format: date
                            example: "2025-09-01"
                          dayOfWeek:
                            type: string
                            example: "Thứ Hai"
                          mentor:
                            type: object
                            properties:
                              _id:
                                type: string
                                example: "60a4f4b2e5b8c5001f7a1234"
                              firstName:
                                type: string
                                example: "Nguyen"
                              lastName:
                                type: string
                                example: "Van A"
                              avatarUrl:
                                type: string
                                example: "https://example.com/avatar.jpg"
                              jobTitle:
                                type: string
                                example: "Senior Developer"
                          timezone:
                            type: string
                            example: "Asia/Ho_Chi_Minh"
                          totalSlots:
                            type: integer
                            example: 8
                          openSlots:
                            type: integer
                            example: 3
                          blockedSlots:
                            type: integer
                            example: 2
                          slots:
                            type: array
                            items:
                              type: object
                              properties:
                                _id:
                                  type: string
                                  example: "slot_id_123"
                                start:
                                  type: string
                                  example: "09:00"
                                end:
                                  type: string
                                  example: "09:30"
                                status:
                                  type: string
                                  enum: [open, blocked]
                                  example: "open"
                                duration:
                                  type: string
                                  example: "30m"
                                isAvailable:
                                  type: boolean
                                  example: true
        "400":
          description: Thiếu mentorId trong query param
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Mentor không tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /availability/today-schedule:
    get:
      tags: [Availability Management]
      summary: Lấy lịch chi tiết trong ngày của mentor
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: date
          required: false
          schema: { type: string, format: date }
          description: YYYY-MM-DD. Nếu không truyền sẽ dùng ngày hiện tại.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "Lịch trong ngày được tải thành công",
                    }
                  schedule:
                    type: object
                    properties:
                      date:
                        { type: string, format: date, example: "2025-09-01" }
                      dayOfWeek: { type: string, example: "Thứ Hai" }
                      mentor:
                        type: object
                        properties:
                          _id: { type: string }
                          firstName: { type: string }
                          lastName: { type: string }
                          avatarUrl: { type: string }
                          jobTitle: { type: string }
                      timezone: { type: string, example: "Asia/Ho_Chi_Minh" }
                      totalSlots: { type: integer }
                      openSlots: { type: integer }
                      blockedSlots: { type: integer }
                      slots:
                        type: array
                        items:
                          type: object
                          properties:
                            _id: { type: string }
                            start: { type: string, example: "09:00" }
                            end: { type: string, example: "09:30" }
                            status:
                              {
                                type: string,
                                enum: [open, blocked, booked, held],
                              }
                            duration: { type: string, example: "30m" }
                            isAvailable: { type: boolean }

  /availability/mentor/range:
    get:
      tags: [Availability Management]
      summary: Lấy availability của mentor trong khoảng thời gian
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: startDate
          schema: { type: string, format: date }
          required: false
        - in: query
          name: endDate
          schema: { type: string, format: date }
          required: false
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  availabilities:
                    type: array
                    items: { $ref: "#/components/schemas/Availability" }
                  count:
                    type: integer
                    example: 3

  /availability/{availabilityId}:
    delete:
      tags: [Availability Management]
      summary: Xóa availability theo id (mentor sở hữu)
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: availabilityId
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{24}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    {
                      type: string,
                      example: "Availability đã được xóa thành công",
                    }

  /availability/overview:
    get:
      tags: [Availability Management]
      summary: Lấy availability overview của mentor trong 7 ngày tới
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  mentor:
                    type: object
                    properties:
                      _id: { type: string }
                      firstName: { type: string }
                      lastName: { type: string }
                      avatarUrl: { type: string }
                  overview:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        dayOfWeek: { type: string }
                        hasAvailability: { type: boolean }
                        slots:
                          type: array
                          items:
                            type: object
                            properties:
                              _id: { type: string }
                              start: { type: string }
                              end: { type: string }
                              status:
                                {
                                  type: string,
                                  enum: [open, blocked, booked, held],
                                }
                        totalSlots: { type: integer }
                        availableSlots: { type: integer }
                        timezone: { type: string }
                  period:
                    type: object
                    properties:
                      startDate: { type: string, format: date }
                      endDate: { type: string, format: date }
                      totalDays: { type: integer, example: 7 }
                  summary:
                    type: object
                    properties:
                      totalDaysWithSlots: { type: integer }
                      totalSlots: { type: integer }
                      totalAvailableSlots: { type: integer }

  /availability/cleanup-old:
    post:
      tags: [Availability Management]
      summary: Manual cleanup availability cũ (Admin only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                daysBack:
                  type: integer
                  minimum: 1
                  maximum: 365
                  default: 3
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    { type: string, example: "Cleanup completed successfully" }
                  deletedCount: { type: integer, example: 25 }
                  cutoffDate: { type: string, format: date-time }
                  daysBack: { type: integer, example: 3 }
                  timestamp: { type: string, format: date-time }
