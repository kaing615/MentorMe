  /profile/search/mentors:
    get:
      tags:
        - Profile Management
      summary: Tìm kiếm mentor theo nhiều tiêu chí
      description: |
        Tìm kiếm mentor theo các tiêu chí khác nhau:
        - Theo tên (firstName + lastName)
        - Theo ID cụ thể
        - Theo danh mục/môn học 
        - Theo kỹ năng
        - Theo địa điểm

        Kết quả được sắp xếp theo rating và có hỗ trợ phân trang.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Tìm kiếm theo tên mentor (tìm kiếm trong firstName và lastName)
          example: "Nguyen Van"
        - in: query
          name: id
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
          description: Tìm kiếm mentor theo ID cụ thể (ObjectId format)
          example: "64a7b8c9d1e2f3g4h5i6j7k8"
        - in: query
          name: category
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Tìm kiếm theo danh mục/môn học
          example: "JavaScript"
        - in: query
          name: skills
          schema:
            type: string
          description: Tìm kiếm theo kỹ năng (phân cách bởi dấu phay)
          example: "React,Node.js,MongoDB"
        - in: query
          name: location
          schema:
            type: string
            minLength: 2
            maxLength: 100
          description: Tìm kiếm theo địa điểm
          example: "Ho Chi Minh"
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Số trang (pagination)
          example: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
          description: Số lượng kết quả mỗi trang
          example: 10
      responses:
        "200":
          description: Tìm kiếm mentor thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "success"
                  data:
                    type: object
                    properties:
                      mentors:
                        type: array
                        items:
                          type: object
                          properties:
                            _id:
                              type: string
                              example: "64a7b8c9d1e2f3g4h5i6j7k8"
                            userName:
                              type: string
                              example: "nguyenvana"
                            firstName:
                              type: string
                              example: "Nguyen"
                            lastName:
                              type: string
                              example: "Van A"
                            email:
                              type: string
                              example: "nguyenvana@email.com"
                            avatarUrl:
                              type: string
                              example: "https://cloudinary.com/avatar.jpg"
                            role:
                              type: array
                              items:
                                type: string
                              example: ["mentor"]
                            profile:
                              type: object
                              properties:
                                _id:
                                  type: string
                                jobTitle:
                                  type: string
                                  example: "Senior Developer"
                                location:
                                  type: string
                                  example: "Ho Chi Minh City"
                                category:
                                  type: string
                                  example: "Web Development"
                                skills:
                                  type: array
                                  items:
                                    type: string
                                  example: ["React", "Node.js", "MongoDB"]
                                bio:
                                  type: string
                                  example: "Experienced developer with 5+ years"
                                headline:
                                  type: string
                                  example: "Full Stack JavaScript Developer"
                                experience:
                                  type: string
                                  example: "5 years"
                                rate:
                                  type: number
                                  example: 4.8
                                reviews:
                                  type: array
                                  items:
                                    type: object
                            coursesCount:
                              type: integer
                              example: 3
                            subjects:
                              type: array
                              items:
                                type: string
                              example: ["JavaScript", "React", "Node.js"]
                            courses:
                              type: array
                              items:
                                type: object
                                description: "Chi tiết khóa học mà mentor đang dạy"
                      pagination:
                        type: object
                        properties:
                          currentPage:
                            type: integer
                            example: 1
                          totalPages:
                            type: integer
                            example: 5
                          totalCount:
                            type: integer
                            example: 47
                          limit:
                            type: integer
                            example: 10
                          hasNext:
                            type: boolean
                            example: true
                          hasPrev:
                            type: boolean
                            example: false
                      searchCriteria:
                        type: object
                        properties:
                          name:
                            type: string
                            example: "Nguyen"
                          id:
                            type: string
                            example: null
                          category:
                            type: string
                            example: "JavaScript"
                          skills:
                            type: string
                            example: "React,Node.js"
                          location:
                            type: string
                            example: "Ho Chi Minh"
        "400":
          description: Lỗi validation tham số tìm kiếm
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "error"
                  message:
                    type: string
                    example: "Tham số tìm kiếm không hợp lệ"
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        field:
                          type: string
                          example: "page"
                        message:
                          type: string
                          example: "page must be greater than or equal to 1"
        "401":
          description: Unauthorized - Token không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Lỗi server khi thực hiện tìm kiếm
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

