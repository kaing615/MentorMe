<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">MentorMe target production architecture</title>
  <desc id="desc">Cloudflare and Nginx route traffic to two Express replicas backed by Redis, RabbitMQ, a worker, and MongoDB Atlas.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#506070"/></marker></defs>
  <rect width="1400" height="760" fill="#f8fafc"/>
  <text x="60" y="70" font-family="Arial" font-size="32" font-weight="700" fill="#17324d">MentorMe — target production topology</text>
  <g font-family="Arial" font-size="18" text-anchor="middle">
    <rect x="60" y="300" width="170" height="90" rx="16" fill="#dae8fc" stroke="#6c8ebf"/><text x="145" y="350">Browser</text>
    <rect x="300" y="290" width="230" height="110" rx="16" fill="#ffe6cc" stroke="#d79b00"/><text x="415" y="335">Cloudflare</text><text x="415" y="365">Pages / CDN / WAF</text>
    <rect x="600" y="290" width="220" height="110" rx="16" fill="#ffe6cc" stroke="#d79b00"/><text x="710" y="335">Nginx</text><text x="710" y="365">Gateway / LB</text>
    <rect x="900" y="170" width="210" height="90" rx="16" fill="#23a2d9" stroke="#0e7dad"/><text x="1005" y="225" fill="white">API replica A</text>
    <rect x="900" y="430" width="210" height="90" rx="16" fill="#23a2d9" stroke="#0e7dad"/><text x="1005" y="485" fill="white">API replica B</text>
    <rect x="1190" y="100" width="170" height="85" rx="16" fill="#f8cecc" stroke="#b85450"/><text x="1275" y="150">Redis</text>
    <rect x="1190" y="270" width="170" height="85" rx="16" fill="#fff2cc" stroke="#d6b656"/><text x="1275" y="320">RabbitMQ</text>
    <rect x="1190" y="440" width="170" height="85" rx="16" fill="#d5e8d4" stroke="#82b366"/><text x="1275" y="490">Worker</text>
    <ellipse cx="1005" cy="650" rx="125" ry="55" fill="#d5e8d4" stroke="#82b366"/><text x="1005" y="657">MongoDB Atlas</text>
  </g>
  <g fill="none" stroke="#506070" stroke-width="3" marker-end="url(#arrow)"><path d="M230 345H300"/><path d="M530 345H600"/><path d="M820 325L900 230"/><path d="M820 365L900 470"/><path d="M1110 215L1190 145"/><path d="M1110 475L1190 315"/><path d="M1190 482H1110"/><path d="M1005 260V595"/><path d="M1005 520V595"/></g>
</svg>
