<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f7ff" />
    <script>
      (() => {
        try {
          const savedTheme = localStorage.getItem("mentorme-theme");
          const theme = savedTheme === "light" || savedTheme === "dark"
            ? savedTheme
            : window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          document.documentElement.dataset.theme = theme;
          document.querySelector('meta[name="theme-color"]').content =
            theme === "dark" ? "#071127" : "#f4f7ff";
        } catch {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="description"
      content="MentorMe helps learners find mentors, book focused sessions, and build practical skills through one-to-one guidance."
    />
    <meta property="og:title" content="MentorMe | Learn with the right mentor" />
    <meta
      property="og:description"
      content="Find experienced mentors and book focused one-to-one learning sessions."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <title>MentorMe | Learn with the right mentor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
