x-api-environment: &api-environment
  NODE_ENV: production
  PORT: 4000
  MONGO_URL: ${MONGO_URL:?MONGO_URL is required}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
  CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
  FRONTEND_URL: ${FRONTEND_URL:?FRONTEND_URL is required}
  PUBLIC_API_URL: ${PUBLIC_API_URL:?PUBLIC_API_URL is required}
  REDIS_ENABLED: "true"
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
  RABBITMQ_ENABLED: "true"
  RABBITMQ_URL: amqp://${RABBITMQ_USER:?RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}@rabbitmq:5672
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SHUTDOWN_TIMEOUT_MS: 15000

x-api-service: &api-service
  init: true
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  pids_limit: 200
  mem_limit: 512m
  cpus: 0.65
  environment: *api-environment
  depends_on:
    redis:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  networks:
    - backend

services:
  gateway:
    image: nginx:1.31.3-alpine3.24
    user: "101:101"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    pids_limit: 100
    mem_limit: 128m
    cpus: 0.25
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
      - ./secrets/origin.pem:/etc/nginx/certs/origin.pem:ro
      - ./secrets/origin-key.pem:/etc/nginx/certs/origin-key.pem:ro
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    networks:
      - edge
      - backend

  api-a:
    <<: *api-service
    image: "${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: mentorme-api-a
    environment:
      <<: *api-environment
      INSTANCE_ID: api-a
    ports:
      - "127.0.0.1:4001:4000"

  api-b:
    <<: *api-service
    image: "${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    container_name: mentorme-api-b
    environment:
      <<: *api-environment
      INSTANCE_ID: api-b
    ports:
      - "127.0.0.1:4002:4000"

  worker:
    image: "${API_IMAGE:?API_IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}"
    command: ["node", "src/worker.js"]
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
    pids_limit: 150
    mem_limit: 384m
    cpus: 0.35
    environment:
      <<: *api-environment
      PROCESS_ROLE: worker
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - backend

  redis:
    image: redis:7.4.10-alpine3.21
    user: "999:999"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 320mb
      - --maxmemory-policy
      - allkeys-lru
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
    volumes:
      - redis-data:/data
    mem_limit: 384m
    cpus: 0.25
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '$$REDIS_PASSWORD' ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:4.3.4-management-alpine
    hostname: rabbitmq
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /var/lib/rabbitmq/mnesia/.erlang.cookie:size=1m,mode=0700,uid=999,gid=999
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq/mnesia
    mem_limit: 768m
    cpus: 0.35
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: -rabbit disk_free_limit 2147483648
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - backend

networks:
  edge:
  backend:

volumes:
  redis-data:
  rabbitmq-data:
